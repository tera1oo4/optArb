services:
  postgres:
    image: postgres:17
    container_name: optarb-postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-optarb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-optarb}
      POSTGRES_DB: ${POSTGRES_DB:-optarb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-optarb} -d $${POSTGRES_DB:-optarb}']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7
    container_name: optarb-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  trader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: optarb-trader
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PERSIST_POSTGRES_URL=${PERSIST_POSTGRES_URL:-postgresql://optarb:optarb@postgres:5432/optarb}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    ports:
      - '${HEALTH_PORT:-8080}:${HEALTH_PORT:-8080}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - capture_data:/app/data/capture

  collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: optarb-collector
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    command: ['node', '--import', 'tsx', 'apps/collector/src/main.ts']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - capture_data:/app/data/capture

volumes:
  postgres_data:
  redis_data:
  capture_data:
